<!doctype html>
<html lang="en">
<body style="margin:0;padding:0;background:#f4f5f7;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7;padding:32px 12px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:12px;border:1px solid #e3e6eb;">
        <tr><td style="padding:28px 32px 8px;">
          <table role="presentation" cellpadding="0" cellspacing="0"><tr>
            <td style="vertical-align:middle;"><img src="https://israel-gap-year-finder.vercel.app/static/logo-email.png" width="48" height="48" alt="" style="display:block;border:0;"></td>
            <td style="vertical-align:middle;padding-left:10px;font-family:Georgia,'Times New Roman',serif;font-size:19px;font-weight:700;color:#0f1217;">Israel Gap Year<br><span style="font-family:Arial,Helvetica,sans-serif;font-size:9px;font-weight:700;letter-spacing:4px;color:#b07a1e;">FINDER</span></td>
          </tr></table>
        </td></tr>
        <tr><td style="padding:12px 32px 4px;font-family:Arial,Helvetica,sans-serif;">
          <h1 style="margin:0 0 12px;font-size:20px;color:#0f1217;">Your login link</h1>
          <p style="margin:0 0 20px;font-size:15px;line-height:1.55;color:#33384a;">Use this link to log in to Israel Gap Year Finder. It works once and expires soon.</p>
          <table role="presentation" cellpadding="0" cellspacing="0"><tr><td style="border-radius:8px;background:#2f5fe0;">
            <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 22px;font-size:15px;font-weight:700;color:#ffffff;text-decoration:none;border-radius:8px;">Log in</a>
          </td></tr></table>
          <p style="margin:20px 0 0;font-size:12.5px;line-height:1.5;color:#6b7180;">If the button doesn't work, copy this link into your browser:<br><a href="{{ .ConfirmationURL }}" style="color:#2f5fe0;word-break:break-all;">{{ .ConfirmationURL }}</a></p>
        </td></tr>
        <tr><td style="padding:20px 32px 28px;font-family:Arial,Helvetica,sans-serif;font-size:12.5px;line-height:1.5;color:#6b7180;border-top:1px solid #eef0f3;">If you didn't ask for a login link, you can ignore this email.</td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
