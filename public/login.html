<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in · Israel Gap Year Finder</title>
  <meta name="description" content="Create an account or log in to see every Israel gap year program and track your applications." />
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png" />
  <meta name="theme-color" content="#0f1217" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@600&display=swap" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="auth-body">
  <main class="auth-wrap">
    <a class="brand auth-brand" href="/login" aria-label="Israel Gap Year Finder"><img class="logo-mark" src="/static/logo-mark.svg" alt="" width="64" height="64" /><span class="wordmark wm-auth"><span class="wm-title">Israel Gap Year</span><span class="wm-sub">Finder</span></span></a>

    <form id="auth-form" class="card auth-card" novalidate>
      <h1 id="title">Log in</h1>
      <p id="subtitle" class="muted">Welcome back. Log in to see all the programs.</p>

      <div id="msg" class="callout" role="status" hidden></div>

      <label class="field" data-show="signup">Name
        <input class="input" id="name" name="name" autocomplete="name" maxlength="80" />
      </label>
      <label class="field" data-show="login signup forgot">Email
        <input class="input" id="email" type="email" name="email" autocomplete="email" />
      </label>
      <label class="field" data-show="login signup reset"><span id="pw-label">Password</span>
        <input class="input" id="password" type="password" name="password" autocomplete="current-password" />
      </label>

      <button class="btn primary auth-submit" id="submit" type="submit">Log in</button>

      <p class="small muted auth-switch" data-show="login"><a href="#" data-mode="forgot">Forgot password?</a></p>
      <p class="small muted auth-switch" data-show="login">New here? <a href="#" data-mode="signup">Create an account</a></p>
      <p class="small muted auth-switch" data-show="signup">Already have an account? <a href="#" data-mode="login">Log in</a></p>
      <p class="small muted auth-switch" data-show="forgot reset"><a href="#" data-mode="login">Back to log in</a></p>
    </form>
    <p class="small muted auth-legal"><a href="/privacy">Privacy</a></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js" integrity="sha384-2zrRDgDHSYB/GN3nFW3fsZXoxEhKIr3N2h63Tc6DEOB9JJdFIu8xMJT2Cph/gBil" crossorigin="anonymous"></script>
  <script src="/js/sb.js"></script>
  <script src="/js/auth.js"></script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
