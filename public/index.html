<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Israel Gap Year Finder</title>
  <meta name="description" content="Find and track Israel gap year programs for Jewish high school seniors: program details, deadlines, essays, aid, visas and college deferral in one place." />
  <link rel="icon" type="image/svg+xml" href="static/favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="static/apple-touch-icon.png" />
  <meta name="theme-color" content="#0f1217" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@600&display=swap" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/" aria-label="Israel Gap Year Finder, home">
        <img class="logo-mark" src="static/logo-mark.svg" alt="" width="40" height="40" />
        <span class="wordmark wm-header"><span class="wm-title">Israel Gap Year</span><span class="wm-sub">Finder</span></span>
      </a>
      <nav class="topnav" aria-label="Main">
        <a href="#/swipe" data-nav="discover">Discover</a>
        <a href="#/browse" data-nav="finder">Browse all</a>
        <a href="#/compare" data-nav="compare">Compare</a>
        <a href="#/colleges" data-nav="colleges">Colleges</a>
        <a href="#/my-list" data-nav="my-list">Saved <span id="saved-count" class="count-pill">0</span></a>
        <span id="account" class="account" hidden>
          <span id="user-name" class="user-name"></span>
          <button id="logout" class="btn ghost sm" type="button">Log out</button>
        </span>
      </nav>
    </div>
  </header>

  <div id="banner" class="callout warn page-banner" role="status" hidden></div>

  <main id="app" class="page" tabindex="-1"><p class="muted">Loading…</p></main>

  <footer class="footer">
    <p>Program details were researched on <span id="as-of"></span> for the <span id="cycle"></span> cycle. Programs change dates and prices, so always confirm on the program's own site. <span id="storage-note">Your tracking data is saved only in this browser.</span></p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
  <script src="js/sb.js"></script>
  <script src="js/data.js"></script>
  <script src="js/details.js"></script>
  <script src="js/stories.js"></script>
  <script src="js/time.js"></script>
  <script src="js/colleges.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
